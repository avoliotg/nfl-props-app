name: capture-lines

# Runs live_capture.py on a clock so opening and closing snapshots are taken
# whether or not the books have posted yet. Thin returns are expected early in
# the week and cost almost nothing, because The Odds API does not charge for
# markets that return no data.

on:
  workflow_dispatch:
  schedule:
    # All times are UTC. Eastern is UTC-4 until November 1 2026, after which
    # every entry below fires one hour earlier in local terms.
    #
    # Base movement grid: every 4 hours, every day.
    - cron: "23 1,5,9,13,17,21 * * *"
    #
    # Sunday afternoon closes. REDUNDANT, as of 2026-10-08. Three entries
    # per kickoff cluster, 30 minutes apart.
    #
    # WHY PLACEMENT FAILED AND REDUNDANCY REPLACES IT.
    #
    # The 2026-09-28 version placed one entry per cluster at the EARLY edge
    # of the 20-to-90-minute window, claiming 60 to 65 minutes of drift
    # tolerance. Measured on 2026-10-04:
    #
    #   scheduled   fired     drift
    #   15:40       16:54     +74 min
    #   18:40       18:47      +7 min
    #   19:00       20:15     +75 min
    #   21:23       22:10     +47 min
    #
    # Two entries exceeded the claimed tolerance. The 15:40 run landed SIX
    # MINUTES before a 17:00 UTC kickoff, so the entire 1pm slate fell in
    # the 0-to-20 band: 2,336 rows there against 188 in the window. The
    # 19:00 run fired after its kickoff and was correctly skipped.
    #
    # Week 4 promoted 165 rows against week 3's 1,821, and week 3 only
    # worked because the OLD 16:23 target happened to drift into the middle.
    #
    # The early edge was the wrong idea in principle. It maximises
    # tolerance for a late run while guaranteeing that an ON-TIME run is
    # too early. With a 70-minute window and drift ranging 7 to 75 minutes,
    # no single entry can cover the range.
    #
    # Three entries 30 minutes apart always land one inside, and
    # promote_closing.py takes the LAST capture in the window, so extra
    # captures only widen its choice.
    #
    #   1pm ET  = 17:00 UTC, window 15:30-16:40 -> 15:10, 15:40, 16:10
    #   4:05 ET = 20:05 UTC, window 18:35-19:45 -> 18:15, 18:45, 19:15
    #   4:25 ET = 20:25 UTC, window 18:55-20:05 -> 18:45, 19:15, 19:45
    #
    # The 4:05 and 4:25 windows overlap by 50 minutes, so 18:45 and 19:15
    # serve both and only 19:45 is specific to 4:25.
    #
    # COST: about 65 credits per run, 13 events x 5 markets. Four extra
    # Sunday runs is roughly 800 credits a month against 100,000 available.
    - cron: "10 15 * * 0"
    - cron: "40 15 * * 0"
    - cron: "10 16 * * 0"
    - cron: "15 18 * * 0"
    - cron: "45 18 * * 0"
    - cron: "15 19 * * 0"
    - cron: "45 19 * * 0"
    #
    # Prime time closes. 23:23 UTC is 7:23pm ET, about 52 minutes before an
    # 8:15pm kickoff. Thursday, Sunday and Monday.
    - cron: "23 23 * * 0,1,4"
    #
    # International closes. 12:23 UTC is 8:23am ET, about 67 minutes before a
    # 9:30am ET kickoff, which is when the London and other overseas games go
    # off. Added 2026-09-28.
    #
    # WHY THIS IS NEEDED, and only until November 1. A 9:30am ET kickoff is
    # 13:30 UTC while Eastern is UTC-4, so the base grid's 13:23 entry fires
    # SEVEN MINUTES before kickoff. That is useless two ways: it is inside the
    # 20-to-90-minute window the historical closing-line instrument uses, and
    # now that live_capture.py skips events that have already started, any
    # scheduler drift past seven minutes means the game is skipped entirely
    # and gets no closing snapshot at all. Observed weekend drift on these
    # runs has been 24 to 154 minutes, so a skip was the likely outcome.
    #
    # After November 1 Eastern is UTC-5, a 9:30am ET kickoff becomes 14:30
    # UTC, and the base grid's 13:23 entry lands 67 minutes out on its own.
    # This entry then fires about 2 hours out instead, which is harmless: it
    # just becomes another movement snapshot. Removable at that point, but
    # there is no cost to leaving it.
    - cron: "23 12 * * 0"

# Off-the-hour minutes are deliberate. Scheduled Actions runs are best effort
# and the top of the hour is the most congested slot, so :23 reduces drift.

# CONCURRENCY REMOVED 2026-10-08. A group with cancel-in-progress false
# QUEUES runs behind each other, so on a Sunday a collision between the
# base grid and a targeted close made the second run wait for the first.
# With seven Sunday entries the collision risk is much higher, and queueing
# is worse than running two captures at once.
#
# Duplicate captures are harmless: every row carries its own captured_at,
# and promote_closing.py selects one row per prop-book regardless of how
# many captures exist.

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          # Cold-installing pandas and nflreadpy costs minutes on every
          # run, and every minute is drift on a time-critical capture.
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "no requirements.txt found, installing minimal set"
            pip install requests pandas nflreadpy supabase
          fi

      - name: Capture
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPAL_EMAIL: ${{ secrets.OPAL_EMAIL }}
          OPAL_PASSWORD: ${{ secrets.OPAL_PASSWORD }}
        run: python live_capture.py
